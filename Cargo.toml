[package]
name = "rifle-rules"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pure, validated declarative rule evaluation over supplied facts"
repository = "https://github.com/SoundBlaster/Rifle"
publish = false

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_json_canonicalizer = "=0.4.1"
sha2 = "0.10"
